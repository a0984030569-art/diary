<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛孩與月曆手帳 | My Daily & Calendar Journal</title>
    <!-- 引入字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 預設：溫潤大地色系風格 (Light Mode) */
        :root {
            --bg-color: #F7F3EE;
            --card-bg: #FFFFFF;
            --earth-primary: #A3704C;     /* 溫潤大地棕色 */
            --earth-hover: #8A5D3E;       /* 較深的棕色 hover */
            --text-main: #4E423B;         /* 深可可色文字 */
            --text-muted: #8C7B73;        /* 柔和灰棕色 */
            --border-color: #E2D4C7;      /* 柔和大地邊框 */
            --shadow: 0 10px 25px rgba(163, 112, 76, 0.08);
            --input-bg: #FAF7F2;
            --today-bg: #F5EBE1;
        }

        /* 闇黑學院風 (Dark Mode - 帶點大地金棕調) */
        body.dark-mode {
            --bg-color: #0f0e0e;
            --card-bg: #171515;
            --earth-primary: #d4af37;     /* 經典金棕色 */
            --earth-hover: #e6c584;
            --text-main: #d4d0c7;
            --text-muted: #9e9a90;
            --border-color: #332e29;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            --input-bg: #141212;
            --today-bg: #2a241b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        /* 頂部切換按鈕 */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--earth-primary);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .theme-toggle-btn:hover {
            background-color: var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--earth-primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* 月曆區塊 */
        .calendar-section {
            margin-bottom: 30px;
            background: var(--input-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-header h2 {
            font-size: 1.2rem;
            color: var(--earth-primary);
        }

        .cal-nav-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .cal-nav-btn:hover {
            background-color: var(--border-color);
            color: var(--earth-primary);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-weekday {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
            padding-bottom: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .calendar-day:hover {
            border-color: var(--earth-primary);
        }

        .calendar-day.selected {
            background-color: var(--earth-primary);
            color: #fff;
            font-weight: bold;
            border-color: var(--earth-primary);
        }
        body.dark-mode .calendar-day.selected {
            color: #0f0e0e;
        }

        .calendar-day.today {
            background-color: var(--today-bg);
            border: 2px solid var(--earth-primary);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        /* 日期小圓點標記 (表示當天有紀錄) */
        .has-note-dot {
            width: 5px;
            height: 5px;
            background-color: var(--earth-primary);
            border-radius: 50%;
            margin-top: 3px;
        }
        .calendar-day.selected .has-note-dot {
            background-color: #fff;
        }
        body.dark-mode .calendar-day.selected .has-note-dot {
            background-color: #0f0e0e;
        }

        /* 當選定日期的詳細內容區 */
        .selected-date-section {
            background: var(--input-bg);
            padding: 25px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .selected-date-title {
            font-size: 1.15rem;
            color: var(--earth-primary);
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 待辦輸入區 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input, .input-group select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .input-group input[type="text"] {
            flex: 1;
        }

        .input-group select {
            width: 120px;
        }

        .add-btn {
            background-color: var(--earth-primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        body.dark-mode .add-btn {
            color: #0f0e0e;
        }

        .add-btn:hover {
            background-color: var(--earth-hover);
        }

        /* 任務列表 */
        .task-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--earth-primary);
            cursor: pointer;
        }

        .tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--border-color);
            color: var(--earth-primary);
            font-weight: bold;
            margin-left: 6px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 6px;
            color: var(--text-muted);
        }

        .action-btn:hover {
            background-color: var(--border-color);
            color: var(--earth-primary);
        }

        /* 當天日記文字框 */
        .day-diary-box {
            margin-top: 15px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .day-diary-box label {
            display: block;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--earth-primary);
            margin-bottom: 8px;
        }

        .day-diary-textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
        }

        .empty-tip {
            text-align: center;
            color: var(--text-muted);
            padding: 15px 0;
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部日夜模式切換 -->
        <div class="top-bar">
            <button class="theme-toggle-btn" id="themeToggleBtn">🌙 切換日夜模式</button>
        </div>

        <h1>🐾 毛孩與月曆手帳</h1>
        <p class="subtitle">點擊月曆上的日期，即可回顧或新增當天的待辦與心情日記</p>

        <!-- 月曆檢視區塊 -->
        <div class="calendar-section">
            <div class="calendar-header">
                <button class="cal-nav-btn" id="prevMonthBtn">◀ 上個月</button>
                <h2 id="calendarTitle">2026年 6月</h2>
                <button class="cal-nav-btn" id="nextMonthBtn">下個月 ▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- 動態生成星期與日期 -->
            </div>
        </div>

        <!-- 選定日期的詳細內容區 -->
        <div class="selected-date-section">
            <div class="selected-date-title">
                <span id="selectedDateText">2026-06-06 的手帳紀錄</span>
            </div>

            <!-- 新增待辦 -->
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="輸入當日待辦事項或照顧提醒...">
                <select id="categorySelect">
                    <option value="毛孩照顧">毛孩照顧</option>
                    <option value="日常生活">日常生活</option>
                    <option value="工作課業">工作課業</option>
                </select>
                <button class="add-btn" id="addBtn">新增</button>
            </div>

            <!-- 當日待辦列表 -->
            <ul class="task-list" id="taskList">
                <!-- 動態生成 -->
            </ul>

            <!-- 當日日記寫作區 -->
            <div class="day-diary-box">
                <label for="dayDiaryInput">📖 當日心情與毛孩手帳日記（自動儲存）</label>
                <textarea class="day-diary-textarea" id="dayDiaryInput" placeholder="寫下這一天的心情、與毛小孩的互動點滴..."></textarea>
            </div>
        </div>
    </div>

    <script>
        // 資料狀態初始化 (以日期字串 YYYY-MM-DD 為 Key 存入 LocalStorage)
        let journalData = JSON.parse(localStorage.getItem('earth_calendar_journal_data')) || {};
        
        // 目前顯示的月曆年月
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth(); // 0-11

        // 預設選中「今天」
        let selectedDateStr = formatDate(new Date());

        // DOM 元素
        const calendarTitle = document.getElementById('calendarTitle');
        const calendarGrid = document.getElementById('calendarGrid');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');
        const selectedDateText = document.getElementById('selectedDateText');
        const taskInput = document.getElementById('taskInput');
        const categorySelect = document.getElementById('categorySelect');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const dayDiaryInput = document.getElementById('dayDiaryInput');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        // 主題狀態初始化
        let isDarkMode = JSON.parse(localStorage.getItem('earth_calendar_journal_dark')) || false;
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️ 切換日夜模式';
        }

        // 格式化日期為 YYYY-MM-DD
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // 取得或初始化指定日期的資料結構
        function getDayData(dateStr) {
            if (!journalData[dateStr]) {
                journalData[dateStr] = { tasks: [], diary: '' };
            }
            return journalData[dateStr];
        }

        // 儲存至 LocalStorage
        function saveData() {
            localStorage.setItem('earth_calendar_journal_data', JSON.stringify(journalData));
        }

        // 渲染月曆
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            calendarTitle.textContent = `${currentYear}年 ${currentMonth + 1}月`;

            // 星期標題
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            weekdays.forEach(wd => {
                const div = document.createElement('div');
                div.className = 'calendar-weekday';
                div.textContent = wd;
                calendarGrid.appendChild(div);
            });

            // 當月第一天是星期幾、當月總天數
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const todayStr = formatDate(new Date());

            // 補齊上個月空白格
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'calendar-day empty';
                calendarGrid.appendChild(emptyDiv);
            }

            // 渲染當月日子
            for (let day = 1; day <= totalDays; day++) {
                const mStr = String(currentMonth + 1).padStart(2, '0');
                const dStr = String(day).padStart(2, '0');
                const dateStr = `${currentYear}-${mStr}-${dStr}`;

                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                if (dateStr === todayStr) dayDiv.classList.add('today');
                if (dateStr === selectedDateStr) dayDiv.classList.add('selected');

                // 檢查該天是否有寫日記或有待辦事項，若有則顯示小圓點
                const dayData = journalData[dateStr];
                const hasContent = dayData && (dayData.diary.trim() !== '' || (dayData.tasks && dayData.tasks.length > 0));

                dayDiv.innerHTML = `
                    <span>${day}</span>
                    ${hasContent ? '<div class="has-note-dot"></div>' : ''}
                `;

                dayDiv.addEventListener('click', () => {
                    selectedDateStr = dateStr;
                    renderCalendar();
                    renderSelectedDayContent();
                });

                calendarGrid.appendChild(dayDiv);
            }
        }

        // 渲染選定日期的詳細內容（待辦與日記）
        function renderSelectedDayContent() {
            selectedDateText.textContent = `${selectedDateStr} 的手帳紀錄`;
            const dayData = getDayData(selectedDateStr);

            // 渲染待辦任務
            taskList.innerHTML = '';
            if (!dayData.tasks || dayData.tasks.length === 0) {
                taskList.innerHTML = `<li class="empty-tip">這一天還沒有新增待辦事項唷～✨</li>`;
            } else {
                dayData.tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    li.innerHTML = `
                        <div class="task-info">
                            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})">
                            <span class="task-text">${escapeHtml(task.text)}<span class="tag">${task.category}</span></span>
                        </div>
                        <button class="action-btn" onclick="deleteTask(${task.id})">刪除</button>
                    `;
                    taskList.appendChild(li);
                });
            }

            // 填入當日日記
            dayDiaryInput.value = dayData.diary || '';
        }

        // 新增當日待辦
        function addTask() {
            const text = taskInput.value.trim();
            if (!text) {
                alert('請輸入待辦內容！');
                return;
            }

            const dayData = getDayData(selectedDateStr);
            const newTask = {
                id: Date.now(),
                text: text,
                category: categorySelect.value,
                completed: false
            };

            dayData.tasks.push(newTask);
            saveData();
            renderSelectedDayContent();
            renderCalendar(); // 更新月曆小圓點
            taskInput.value = '';
        }

        // 切換任務完成狀態
        window.toggleTask = function(id) {
            const dayData = getDayData(selectedDateStr);
            dayData.tasks = dayData.tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveData();
            renderSelectedDayContent();
        };

        // 刪除任務
        window.deleteTask = function(id) {
            const dayData = getDayData(selectedDateStr);
            dayData.tasks = dayData.tasks.filter(t => t.id !== id);
            saveData();
            renderSelectedDayContent();
            renderCalendar();
        };

        // 監聽當日日記即時自動儲存
        dayDiaryInput.addEventListener('input', () => {
            const dayData = getDayData(selectedDateStr);
            dayData.diary = dayDiaryInput.value;
            saveData();
            renderCalendar(); // 更新月曆小圓點
        });

        // 上／下個月按鈕
        prevMonthBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        });

        nextMonthBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        });

        // 日夜模式切換
        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            localStorage.setItem('earth_calendar_journal_dark', JSON.stringify(isDarkMode));
            themeToggleBtn.textContent = isDarkMode ? '☀️ 切換日夜模式' : '🌙 切換日夜模式';
        });

        // XSS 防護
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // 初始化渲染
        renderCalendar();
        renderSelectedDayContent();
    </script>
</body>
</html>
