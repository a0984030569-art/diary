<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Flow | 個人生活與財務手帳</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4efe6;
            --card-bg: #fffbf5;
            --accent-gold: #9c7c47;
            --accent-hover: #b89355;
            --text-main: #3e3832;
            --text-muted: #82786f;
            --border-color: #e3d7c8;
            --shadow: 0 10px 30px rgba(156, 124, 71, 0.1);
            --danger: #b85c5c;
            --success: #5c9c63;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 25px;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 頁籤導覽 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-gold);
            color: #fff;
            border-color: var(--accent-gold);
        }

        .panel {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .panel.active {
            display: block;
        }

        h2 {
            color: var(--accent-gold);
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 15px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .btn {
            background-color: var(--accent-gold);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .search-box {
            margin-bottom: 20px;
        }

        .calendar-section {
            background-color: #fcf8f2;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .finance-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background-color: #fcf8f2;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .summary-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .summary-card .amount {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .chart-container {
            background-color: #fcf8f2;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 260px;
        }

        .record-list {
            list-style: none;
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .record-item {
            background-color: #fcf8f2;
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-info span {
            display: block;
        }

        .record-title {
            font-weight: bold;
            color: var(--text-main);
        }

        .record-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
            margin-top: 3px;
        }

        .record-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .record-amount {
            font-weight: bold;
        }

        .income { color: var(--success); }
        .expense { color: var(--danger); }

        .del-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .del-btn:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌿 Daily Flow</h1>
            <p class="subtitle">個人生活行程管理與財務記帳 🐾</p>
        </header>

        <!-- 頁籤導覽 -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('diary')">📅 日常手帳與記事</button>
            <button class="tab-btn" onclick="switchTab('finance')">💰 智能財務與記帳</button>
        </div>

        <!-- 頁籤一：日常手帳與行程 -->
        <div id="diary" class="panel active">
            <h2>📅 每日行程與心情手帳</h2>
            
            <div class="calendar-section" id="currentMonthDisplay">
                🗓️ 載入行事曆中...
            </div>

            <div class="form-group search-box">
                <label>🔍 快速檢索歷史手帳</label>
                <input type="text" id="searchInput" placeholder="輸入關鍵字搜尋記事..." oninput="renderDiaries()">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>選擇日期</label>
                    <input type="date" id="diaryDate">
                </div>
                <div class="form-group">
                    <label>今日心情狀態</label>
                    <select id="diaryMood">
                        <option value="😊 開心愉快">😊 開心愉快</option>
                        <option value="🐾 慵懶放鬆">🐾 慵懶放鬆</option>
                        <option value="✨ 充實期待">✨ 充實期待</option>
                        <option value="☕ 平靜溫馨">☕ 平靜溫馨</option>
                        <option value="🌧️ 疲憊需要休息">🌧️ 疲憊需要休息</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>今日心情與備忘內容</label>
                <textarea id="diaryContent" rows="3" placeholder="例如：今天完成專案進度，心情放鬆... 🐾"></textarea>
            </div>
            <button class="btn" onclick="addDiary()">儲存今日手帳</button>

            <ul class="record-list" id="diaryList"></ul>
        </div>

        <!-- 頁籤二：智能財務與記帳 -->
        <div id="finance" class="panel">
            <h2>💰 個人收支與預算管理</h2>
            
            <div class="finance-summary">
                <div class="summary-card">
                    <h3>本月總收入</h3>
                    <div class="amount income" id="totalIncome">NT$ 0</div>
                </div>
                <div class="summary-card">
                    <h3>本月總支出</h3>
                    <div class="amount expense" id="totalExpense">NT$ 0</div>
                </div>
                <div class="summary-card">
                    <h3>結餘（剩餘）</h3>
                    <div class="amount" id="totalBalance">NT$ 0</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end;">
                <div class="form-group" style="margin:0;">
                    <label>項目名稱</label>
                    <input type="text" id="txTitle" placeholder="例如：餐飲 / 寵物用品">
                </div>
                <div class="form-group" style="margin:0;">
                    <label>金額</label>
                    <input type="number" id="txAmount" placeholder="0">
                </div>
                <div class="form-group" style="margin:0;">
                    <label>類型</label>
                    <select id="txType">
                        <option value="expense">支出</option>
                        <option value="income">收入</option>
                    </select>
                </div>
                <button class="btn" style="margin:0; height: 42px;" onclick="addTransaction()">新增</button>
            </div>

            <ul class="record-list" id="txList" style="margin-top: 25px;"></ul>
        </div>

        <footer>
            &copy; 2026 Daily Flow. All Rights Reserved. Designed with Elegance & Care 🐾
        </footer>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        document.getElementById('currentMonthDisplay').innerText = `🗓️ ${year} 年 ${month} 月行程總覽`;
        document.getElementById('diaryDate').valueAsDate = new Date();

        let diaries = JSON.parse(localStorage.getItem('diaries')) || [];
        function addDiary() {
            const date = document.getElementById('diaryDate').value;
            const mood = document.getElementById('diaryMood').value;
            const content = document.getElementById('diaryContent').value;
            if(!date || !content) { alert('請填寫日期與內容'); return; }

            diaries.unshift({ id: Date.now(), date, mood, content });
            localStorage.setItem('diaries', JSON.stringify(diaries));
            renderDiaries();
            document.getElementById('diaryContent').value = '';
        }

        function deleteDiary(id) {
            diaries = diaries.filter(d => d.id !== id);
            localStorage.setItem('diaries', JSON.stringify(diaries));
            renderDiaries();
        }

        function renderDiaries() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('diaryList');
            
            const filtered = diaries.filter(d => 
                d.content.toLowerCase().includes(keyword) || d.date.includes(keyword) || d.mood.toLowerCase().includes(keyword)
            );

            list.innerHTML = filtered.map(d => `
                <li class="record-item">
                    <div class="record-info">
                        <span class="record-title">${d.content}</span>
                        <div class="record-meta">
                            <span>📅 ${d.date}</span>
                            <span>${d.mood || '😊 開心愉快'}</span>
                        </div>
                    </div>
                    <button class="del-btn" onclick="deleteDiary(${d.id})">刪除</button>
                </li>
            `).join('');
        }

        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let myChart = null;

        function addTransaction() {
            const title = document.getElementById('txTitle').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const type = document.getElementById('txType').value;

            if(!title || isNaN(amount)) { alert('請填寫完整的項目與金額'); return; }

            transactions.unshift({ id: Date.now(), title, amount, type });
            localStorage.setItem('transactions', JSON.stringify(transactions));
            renderTransactions();
            
            document.getElementById('txTitle').value = '';
            document.getElementById('txAmount').value = '';
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('transactions', JSON.stringify(transactions));
            renderTransactions();
        }

        function renderTransactions() {
            const list = document.getElementById('txList');
            let income = 0, expense = 0;
            let expenseCategories = {};

            list.innerHTML = transactions.map(t => {
                if(t.type === 'income') {
                    income += t.amount;
                } else {
                    expense += t.amount;
                    expenseCategories[t.title] = (expenseCategories[t.title] || 0) + t.amount;
                }

                return `
                    <li class="record-item">
                        <div class="record-info">
                            <span class="record-title">${t.title}</span>
                            <span class="record-date">${t.type === 'income' ? '收入' : '支出'}</span>
                        </div>
                        <div class="record-right">
                            <span class="record-amount ${t.type}">
                                ${t.type === 'income' ? '+' : '-'} NT$ ${t.amount.toLocaleString()}
                            </span>
                            <button class="del-btn" onclick="deleteTransaction(${t.id})">刪除</button>
                        </div>
                    </li>
                `;
            }).join('');

            document.getElementById('totalIncome').innerText = `NT$ ${income.toLocaleString()}`;
            document.getElementById('totalExpense').innerText = `NT$ ${expense.toLocaleString()}`;
            const balance = income - expense;
            document.getElementById('totalBalance').innerText = `NT$ ${balance.toLocaleString()}`;

            updateChart(expenseCategories);
        }

        function updateChart(categories) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(categories);
            const data = Object.values(categories);

            if (myChart) {
                myChart.destroy();
            }

            const earthColors = ['#9c7c47', '#b89355', '#c4a675', '#d99b6b', '#82786f', '#d4bfa8'];

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length > 0 ? labels : ['尚無支出紀錄'],
                    datasets: [{
                        data: data.length > 0 ? data : [1],
                        backgroundColor: labels.length > 0 ? earthColors.slice(0, labels.length) : ['#e3d7c8'],
                        borderWidth: 1,
                        borderColor: '#fffbf5'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#3e3832',
                                font: { family: 'Zen Maru Gothic', size: 12 }
                            }
                        }
                    }
                }
            });
        }

        renderDiaries();
        renderTransactions();
    </script>
</body>
</html>
