<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛孩與日常手帳 | My Daily & Pet Journal</title>
    <!-- 引入字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 預設：溫馨粉嫩風 (Light Mode) */
        :root {
            --bg-color: #FAF6F0;
            --card-bg: #FFFFFF;
            --primary-pink: #E88CA0;
            --primary-hover: #D77A90;
            --text-main: #5C4B43;
            --text-muted: #9E8C82;
            --border-color: #F3D9DE;
            --shadow: 0 10px 25px rgba(232, 140, 160, 0.08);
            --input-bg: #FAFAFA;
        }

        /* 闇黑學院風 (Dark Mode) */
        body.dark-mode {
            --bg-color: #0f0e0e;
            --card-bg: #171515;
            --primary-pink: #c5a059;
            --primary-hover: #e6c584;
            --text-main: #d4d0c7;
            --text-muted: #9e9a90;
            --border-color: #332e29;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            --input-bg: #141212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'PingFang TC', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 680px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* 頂部切換按鈕 */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--primary-pink);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .theme-toggle-btn:hover {
            background-color: var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--primary-pink);
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* 輸入表單區塊 */
        .input-section {
            background: var(--input-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .input-group input, .input-group select {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
        }

        .input-group input[type="text"] {
            flex: 1;
        }

        .input-group input[type="date"] {
            width: 150px;
        }

        .input-group select {
            width: 120px;
        }

        .add-btn {
            width: 100%;
            background-color: var(--primary-pink);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        body.dark-mode .add-btn {
            color: #0f0e0e;
        }

        .add-btn:hover {
            background-color: var(--primary-hover);
        }

        /* 篩選標籤按鈕 */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .filter-btn.active {
            background-color: var(--border-color);
            color: var(--primary-pink);
            font-weight: 700;
        }

        /* 清單列表 */
        .task-list {
            list-style: none;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 35px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-info {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-pink);
            cursor: pointer;
            margin-top: 3px;
        }

        .task-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-text {
            font-size: 1rem;
            word-break: break-all;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tag {
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--border-color);
            color: var(--primary-pink);
            font-weight: bold;
        }

        .countdown {
            color: #d97706;
            font-weight: bold;
        }
        body.dark-mode .countdown {
            color: #e6c584;
        }

        .countdown.expired {
            color: #ef4444;
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 6px;
            color: var(--text-muted);
        }

        .action-btn:hover {
            background-color: var(--border-color);
            color: var(--primary-pink);
        }

        /* 每日心情日記區 */
        .diary-section {
            border-top: 2px dashed var(--border-color);
            padding-top: 25px;
        }

        .diary-section h2 {
            font-size: 1.2rem;
            color: var(--primary-pink);
            margin-bottom: 10px;
        }

        .diary-textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            resize: vertical;
            outline: none;
            margin-bottom: 10px;
        }

        .diary-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .save-diary-btn {
            background-color: var(--border-color);
            color: var(--primary-pink);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-diary-btn:hover {
            background-color: var(--primary-pink);
            color: #fff;
        }

        .diary-status {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .empty-tip {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部日夜模式切換 -->
        <div class="top-bar">
            <button class="theme-toggle-btn" id="themeToggleBtn">🌙 切換日夜模式</button>
        </div>

        <h1>🐾 毛孩與日常手帳</h1>
        <p class="subtitle">整合待辦、倒數計時、編輯與每日心情日記</p>

        <!-- 新增記事輸入區塊 -->
        <div class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="輸入待辦事項或照顧提醒...">
                <select id="categorySelect">
                    <option value="毛孩照顧">毛孩照顧</option>
                    <option value="日常生活">日常生活</option>
                    <option value="工作課業">工作課業</option>
                </select>
            </div>
            <div class="input-group" style="margin-bottom: 12px;">
                <input type="date" id="taskDate" title="指定日期">
            </div>
            <button class="add-btn" id="addBtn">新增記事</button>
        </div>

        <!-- 類別篩選 -->
        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="毛孩照顧">毛孩照顧</button>
            <button class="filter-btn" data-filter="日常生活">日常生活</button>
            <button class="filter-btn" data-filter="工作課業">工作課業</button>
        </div>

        <!-- 任務列表 -->
        <ul class="task-list" id="taskList">
            <!-- 動態生成 -->
        </ul>

        <!-- 每日心情日記區 -->
        <div class="diary-section">
            <h2>📖 今日手帳與心情筆記</h2>
            <textarea class="diary-textarea" id="diaryInput" placeholder="寫下今天的心情、與毛孩的溫馨互動，或是靈感點滴..."></textarea>
            <div class="diary-footer">
                <span class="diary-status" id="diaryStatus">資料已自動儲存</span>
                <button class="save-diary-btn" id="saveDiaryBtn">手動儲存日記</button>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素
        const taskInput = document.getElementById('taskInput');
        const taskDate = document.getElementById('taskDate');
        const categorySelect = document.getElementById('categorySelect');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const diaryInput = document.getElementById('diaryInput');
        const saveDiaryBtn = document.getElementById('saveDiaryBtn');
        const diaryStatus = document.getElementById('diaryStatus');

        // 資料狀態初始化 (LocalStorage)
        let tasks = JSON.parse(localStorage.getItem('ultimate_pet_diary_tasks')) || [
            { id: 1, text: '帶巧克力去打狂犬疫苗', category: '毛孩照顧', date: '2026-06-15', completed: false },
            { id: 2, text: '繳交行銷管理期末報告', category: '工作課業', date: '2026-06-10', completed: true }
        ];
        let currentFilter = 'all';
        let editingId = null; // 記錄目前正在編輯的任務 ID

        // 主題狀態初始化
        let isDarkMode = JSON.parse(localStorage.getItem('ultimate_pet_diary_dark')) || false;
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️ 切換日夜模式';
        }

        // 儲存任務至 LocalStorage
        function saveTasks() {
            localStorage.setItem('ultimate_pet_diary_tasks', JSON.stringify(tasks));
        }

        // 計算倒數天數
        function getCountdownText(dateStr) {
            if (!dateStr) return '';
            const today = new Date();
            today.setHours(0,0,0,0);
            const targetDate = new Date(dateStr);
            targetDate.setHours(0,0,0,0);
            
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return `<span class="countdown expired">已過期 ${Math.abs(diffDays)} 天</span>`;
            } else if (diffDays === 0) {
                return `<span class="countdown">就是今天！</span>`;
            } else {
                return `<span class="countdown">剩餘 ${diffDays} 天</span>`;
            }
        }

        // 渲染任務清單
        function renderTasks() {
            taskList.innerHTML = '';

            const filteredTasks = tasks.filter(task => {
                if (currentFilter === 'all') return true;
                return task.category === currentFilter;
            });

            if (filteredTasks.length === 0) {
                taskList.innerHTML = `<li class="empty-tip">目前沒有相關的手帳紀錄唷～✨</li>`;
                return;
            }

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = `task-item ${task.completed ? 'completed' : ''}`;
                
                const countdownHtml = getCountdownText(task.date);

                li.innerHTML = `
                    <div class="task-info">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})">
                        <div class="task-details">
                            <span class="task-text">${escapeHtml(task.text)}</span>
                            <div class="task-meta">
                                <span class="tag">${task.category}</span>
                                ${task.date ? `<span>📅 ${task.date}</span>` : ''}
                                ${countdownHtml}
                            </div>
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="action-btn" onclick="editTask(${task.id})">編輯</button>
                        <button class="action-btn" onclick="deleteTask(${task.id})">刪除</button>
                    </div>
                `;
                taskList.appendChild(li);
            });
        }

        // 新增或更新任務
        function handleAddOrUpdateTask() {
            const text = taskInput.value.trim();
            if (!text) {
                alert('請輸入記事內容！');
                return;
            }

            if (editingId !== null) {
                // 編輯模式
                tasks = tasks.map(task => {
                    if (task.id === editingId) {
                        return { 
                            ...task, 
                            text: text, 
                            category: categorySelect.value, 
                            date: taskDate.value 
                        };
                    }
                    return task;
                });
                editingId = null;
                addBtn.textContent = '新增記事';
            } else {
                // 新增模式
                const newTask = {
                    id: Date.now(),
                    text: text,
                    category: categorySelect.value,
                    date: taskDate.value,
                    completed: false
                };
                tasks.unshift(newTask);
            }

            saveTasks();
            renderTasks();
            
            // 清空輸入框
            taskInput.value = '';
            taskDate.value = '';
        }

        // 勾選完成切換
        window.toggleTask = function(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveTasks();
            renderTasks();
        };

        // 刪除任務
        window.deleteTask = function(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
        };

        // 點擊編輯
        window.editTask = function(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            taskInput.value = task.text;
            categorySelect.value = task.category;
            taskDate.value = task.date || '';
            editingId = id;
            addBtn.textContent = '確認修改';
            taskInput.focus();
        };

        // XSS 防護
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 事件監聽：新增/修改按鈕
        addBtn.addEventListener('click', handleAddOrUpdateTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAddOrUpdateTask();
        });

        // 篩選切換
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderTasks();
            });
        });

        // 日夜模式切換
        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
            localStorage.setItem('ultimate_pet_diary_dark', JSON.stringify(isDarkMode));
            themeToggleBtn.textContent = isDarkMode ? '☀️ 切換日夜模式' : '🌙 切換日夜模式';
        });

        // 心情日記自動儲存 (LocalStorage)
        diaryInput.value = localStorage.getItem('ultimate_pet_diary_text') || '';
        
        diaryInput.addEventListener('input', () => {
            localStorage.setItem('ultimate_pet_diary_text', diaryInput.value);
            diaryStatus.textContent = "已自動儲存 💾";
            setTimeout(() => {
                diaryStatus.textContent = "資料已自動儲存";
            }, 2000);
        });

        saveDiaryBtn.addEventListener('click', () => {
            localStorage.setItem('ultimate_pet_diary_text', diaryInput.value);
            alert('手帳日記已手動儲存成功！✨');
        });

        // 初始化
        renderTasks();
    </script>
</body>
</html>
